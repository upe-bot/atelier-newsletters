<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Atelier Newsletters — Union pour l'Enfance</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--vert:#0A6F71;--profond:#073A3B;--sable:#F7BE47;--encre:#12302F;--grisvert:#5E7473;--creme:#FAF7F0;--eau:#E4F0F0}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--profond);color:var(--encre);
  font-family:'Poppins','Century Gothic',Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px}
.carte{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:38px 34px 30px;
  box-shadow:0 24px 60px rgba(0,0,0,.28)}
.arc{width:34px;height:46px;background:var(--sable);border-radius:17px 17px 0 0;margin:0 0 22px}
h1{font-size:21px;line-height:29px;margin:0 0 6px;letter-spacing:-.2px;color:var(--profond)}
.sous{font-size:12px;line-height:18px;letter-spacing:1.6px;text-transform:uppercase;
  font-weight:700;color:var(--vert);margin:0 0 20px}
p.txt{font-size:14.5px;line-height:23px;color:var(--grisvert);margin:0 0 22px}
label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
  font-weight:700;color:var(--grisvert);margin:0 0 7px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;
  border:1.5px solid #D6E0E0;border-radius:8px;background:var(--creme);color:var(--encre)}
input[type=password]:focus{outline:none;border-color:var(--vert);background:#fff}
.memo{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:13.5px;color:var(--grisvert)}
.memo input{width:16px;height:16px;accent-color:var(--vert)}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:13px;border:0;border-radius:8px;
  background:var(--vert);color:#fff;cursor:pointer}
button:hover{background:var(--profond)}
button[disabled]{opacity:.6;cursor:progress}
.msg{font-size:13.5px;line-height:21px;margin:16px 0 0;min-height:21px}
.msg.err{color:#A3311F;font-weight:600}
.msg.att{color:var(--grisvert)}
.pied{margin:26px 0 0;padding-top:18px;border-top:1px solid #E7EDED;
  font-size:11.5px;line-height:18px;color:var(--grisvert)}
</style>
</head>
<body>
<main class="carte">
  <div class="arc" aria-hidden="true"></div>
  <p class="sous">Union pour l'Enfance</p>
  <h1>Atelier Newsletters</h1>
  <p class="txt">Cet espace est réservé. Entrez le mot de passe communiqué par la Direction de la Mobilisation et des Partenariats.</p>
  <form id="f" autocomplete="on">
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" name="password" autocomplete="current-password" autofocus />
    <div class="memo"><input type="checkbox" id="memo" /><label for="memo" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:400;color:var(--grisvert)">Se souvenir sur cet ordinateur</label></div>
    <button type="submit" id="ok">Entrer</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <p class="pied">Le contenu de cette page est chiffré. Sans le mot de passe, il n'est pas lisible, même en affichant le code source.</p>
</main>

const msg=document.getElementById('msg'), champ=document.getElementById('mdp'), bouton=document.getElementById('ok');

function dit(t,classe){ msg.textContent=t; msg.className='msg'+(classe?' '+classe:''); }

function octets(b64){
  const bin=atob(b64); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}

async function ouvrir(mdp){
  const tout=octets(CHARGE);
  const sel=tout.slice(0,16), iv=tout.slice(16,28), corps=tout.slice(28);
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveKey']);
  const cle=await crypto.subtle.deriveKey({name:'PBKDF2',salt:sel,iterations:ITER,hash:'SHA-256'},
    base, {name:'AES-GCM',length:256}, false, ['decrypt']);
  const comprime=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv}, cle, corps);
  const flux=new Blob([comprime]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(flux).text();
}

async function essayer(mdp, silencieux){
  if(!mdp){ champ.focus(); return false; }
  bouton.disabled=true; dit('Déchiffrement en cours…','att');
  try{
    const html=await ouvrir(mdp);
    if(document.getElementById('memo').checked){ try{ localStorage.setItem(CLE,mdp); }catch(e){} }
    try{ sessionStorage.setItem(CLE,mdp); }catch(e){}
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    try{ localStorage.removeItem(CLE); sessionStorage.removeItem(CLE); }catch(x){}
    bouton.disabled=false;
    if(!silencieux){ dit('Mot de passe incorrect.','err'); champ.select(); }
    else dit('');
    return false;
  }
}

document.getElementById('f').addEventListener('submit', e=>{ e.preventDefault(); essayer(champ.value,false); });

(async()=>{
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){
    dit("Ce navigateur est trop ancien pour ouvrir l'atelier. Utilisez une version récente de Chrome, Edge, Firefox ou Safari.",'err');
    bouton.disabled=true; return;
  }
  let garde=null;
  try{ garde=sessionStorage.getItem(CLE)||localStorage.getItem(CLE); }catch(e){}
  if(garde){ document.getElementById('memo').checked=true; await essayer(garde,true); }
})();
})();
</script>
